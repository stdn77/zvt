<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZVIT - Авторизація через QR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        #qrcode {
            margin: 30px auto;
            padding: 20px;
            background: white;
            border: 2px solid #eee;
            border-radius: 10px;
            display: inline-block;
        }

        .instructions {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .instructions ol {
            padding-left: 20px;
            color: #666;
            line-height: 1.8;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status.authorized {
            background: #d4edda;
            color: #155724;
        }

        .status.expired {
            background: #f8d7da;
            color: #721c24;
        }

        .timer {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 ZVIT</h1>
        <p class="subtitle">Авторизація для перегляду звітів</p>

        <div id="qrcode"></div>

        <div class="instructions">
            <h3>📱 Як авторизуватися:</h3>
            <ol>
                <li>Відкрийте додаток ZVIT на телефоні</li>
                <li>Натисніть кнопку сканування QR коду</li>
                <li>Наведіть камеру на QR код</li>
                <li>Оберіть групу для перегляду звітів</li>
            </ol>
        </div>

        <div id="status" class="status waiting">
            <div class="spinner"></div>
            Очікування авторизації...
        </div>

        <div class="timer">
            QR код дійсний: <span id="timer">10:00</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script th:inline="javascript">
        const sessionToken = /*[[${sessionToken}]]*/ '';
        const qrUrl = /*[[${qrUrl}]]*/ '';
        let expiresIn = /*[[${expiresIn}]]*/ 600;

        // Generate QR code
        new QRCode(document.getElementById("qrcode"), {
            text: qrUrl,
            width: 256,
            height: 256,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Timer countdown
        function updateTimer() {
            const minutes = Math.floor(expiresIn / 60);
            const seconds = expiresIn % 60;
            document.getElementById('timer').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (expiresIn > 0) {
                expiresIn--;
            } else {
                document.getElementById('status').className = 'status expired';
                document.getElementById('status').innerHTML = '❌ QR код прострочений. Оновіть сторінку.';
                clearInterval(timerInterval);
                clearInterval(pollingInterval);
            }
        }

        const timerInterval = setInterval(updateTimer, 1000);

        // Poll for authorization status
        async function checkStatus() {
            try {
                const response = await fetch(`/api/web-session/status/${sessionToken}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.isAuthorized) {
                        document.getElementById('status').className = 'status authorized';
                        document.getElementById('status').innerHTML = '✅ Авторизовано! Перенаправлення...';
                        clearInterval(pollingInterval);
                        clearInterval(timerInterval);
                        setTimeout(() => {
                            window.location.href = `/web/reports?token=${sessionToken}`;
                        }, 1000);
                    }
                } else if (response.status === 404 || response.status === 410) {
                    // Сесію не знайдено або прострочено
                    document.getElementById('status').className = 'status expired';
                    document.getElementById('status').innerHTML = '❌ QR код прострочений. <a href="javascript:location.reload()">Оновіть сторінку</a>';
                    clearInterval(pollingInterval);
                    clearInterval(timerInterval);
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        const pollingInterval = setInterval(checkStatus, 2000); // Poll every 2 seconds
    </script>
</body>
</html>
